name: Update Media Proxy Image

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current image info
        id: current
        run: |
          # hosts/media-proxy/compose.yamlから現在のダイジェストを取得
          CURRENT_LINE=$(grep "ghcr.io/chan-mai/media-proxy-rs" hosts/media-proxy/compose.yaml)
          echo "Current line from hosts/media-proxy/compose.yaml: $CURRENT_LINE"

          CURRENT_FULL_DIGEST=$(echo "$CURRENT_LINE" | sed -n 's/.*@\(sha256:[a-f0-9]*\).*/\1/p')
          echo "current_full_digest=$CURRENT_FULL_DIGEST" >> $GITHUB_OUTPUT
          echo "Current digest: $CURRENT_FULL_DIGEST"

      - name: Get latest image info
        id: latest
        run: |
          # mainタグの最新ダイジェストを取得(リリースタグが無いためダイジェスト追従)
          FULL_DIGEST=$(docker buildx imagetools inspect "ghcr.io/chan-mai/media-proxy-rs:main" --format "{{json .Manifest}}" | jq -r '.digest')
          SHORT_DIGEST=$(echo "$FULL_DIGEST" | sed 's/sha256://' | cut -c1-12)

          echo "latest_full_digest=$FULL_DIGEST" >> $GITHUB_OUTPUT
          echo "latest_short_digest=$SHORT_DIGEST" >> $GITHUB_OUTPUT
          echo "Latest digest: $FULL_DIGEST"

      - name: Check for updates
        id: check
        run: |
          CURRENT="${{ steps.current.outputs.current_full_digest }}"
          LATEST="${{ steps.latest.outputs.latest_full_digest }}"

          echo "Current: $CURRENT"
          echo "Latest:  $LATEST"

          if [ -n "$LATEST" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "update_available=true" >> $GITHUB_OUTPUT
            echo "Update available"
          else
            echo "update_available=false" >> $GITHUB_OUTPUT
            echo "Already up to date"
          fi

      - name: Update hosts/media-proxy/compose.yaml
        if: steps.check.outputs.update_available == 'true'
        run: |
          FULL_DIGEST="${{ steps.latest.outputs.latest_full_digest }}"
          NEW_LINE="    image: ghcr.io/chan-mai/media-proxy-rs:main@${FULL_DIGEST}"

          sed -i "s|.*ghcr.io/chan-mai/media-proxy-rs.*|${NEW_LINE}|" hosts/media-proxy/compose.yaml

          echo "New image reference: ${NEW_LINE}"
          echo "--- Git diff ---"
          git diff hosts/media-proxy/compose.yaml

      - name: Create Pull Request
        if: steps.check.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update media-proxy-rs to main@${{ steps.latest.outputs.latest_short_digest }}"
          title: "chore: Update media-proxy-rs to main@${{ steps.latest.outputs.latest_short_digest }}"
          body: |
            ## media-proxy-rsイメージの更新

            このPRは自動的に生成されました。mainタグのダイジェスト更新を追従します。

            ### 変更内容
            | 項目 | 現在 | 更新後 |
            |------|------|--------|
            | ダイジェスト | `${{ steps.current.outputs.current_full_digest }}` | `${{ steps.latest.outputs.latest_full_digest }}` |

            ### 関連リンク
            - [media-proxy-rsレポジトリ](https://github.com/chan-mai/media-proxy-rs)
            - [コミット履歴](https://github.com/chan-mai/media-proxy-rs/commits/main/)
            - [イメージレジストリ](https://github.com/chan-mai/media-proxy-rs/pkgs/container/media-proxy-rs)
          branch: update-media-proxy-rs
          delete-branch: true
          labels: |
            dependencies
            automated pr
